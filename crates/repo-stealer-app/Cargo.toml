[package]
name = "repo-stealer-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
repo-stealer-migration = { path = "../repo-stealer-migration" }
repo-stealer-vault = { path = "../repo-stealer-vault" }
repo-stealer-git = { path = "../repo-stealer-git" }
serde = { version = "1.0", features = ["derive"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.15"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
libc = "0.2"
anyhow = "1.0"
