name: Build, verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_TAG: ci-staging-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  staging:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - if: github.event_name != 'pull_request'
        name: Reserve temporary draft for cross-job files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$STAGING_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Temporary CI build $GITHUB_RUN_ID" --notes "Temporary encrypted test fixtures and build files. Removed when this workflow finishes."

  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check declared minimum compiler
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --locked

  native:
    needs: staging
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            binary: target/release/repo-stealer
          - os: windows-2022
            platform: windows
            binary: target/release/repo-stealer.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --workspace --release --locked -- --test-threads=1
      - run: cargo build --release --locked -p repo-stealer-cli
      - name: Native CLI, crash and portability fixture
        run: python scripts/test_cli.py ${{ matrix.binary }} --fixture-out fixture/portable.rsbackup
      - name: Read the committed format fixture
        run: python scripts/test_cli.py ${{ matrix.binary }} --restore-fixture tests/fixtures/portable-v1.rsbackup
      - if: runner.os == 'Linux'
        name: Provision isolated CI LUKS image
        run: |
          sudo apt-get update && sudo apt-get install -y cryptsetup
          python scripts/ci_workspace.py create
      - name: Full-history Git on verified encrypted storage
        run: python scripts/test_git.py ${{ matrix.binary }} --fixture-out fixture/git-portable.rsbackup
      - name: HTTPS capture, authentication, trust and source mutation
        run: python scripts/test_remote.py ${{ matrix.binary }} --fixture-out fixture/remote-portable.rsbackup
      - name: Read-only GitHub and GitLab destination plans
        run: python scripts/test_migration.py ${{ matrix.binary }}
      - if: always() && runner.os == 'Linux'
        name: Unmount and inspect raw encrypted image
        run: python scripts/ci_workspace.py destroy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils
      - run: python scripts/package.py
      - if: runner.os == 'Linux'
        name: Install Debian package
        run: |
          sudo dpkg -i dist/*.deb
          repo-stealer --version
      - if: runner.os == 'Linux'
        name: Install RPM on Fedora and openSUSE
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:43 bash -c 'dnf install -y /packages/*.rpm && repo-stealer --version'
          docker run --rm -v "$PWD/dist:/packages:ro" opensuse/leap:16.0 sh -c 'zypper --non-interactive --no-gpg-checks install /packages/*.rpm && repo-stealer --version'
      - if: github.event_name != 'pull_request'
        name: Transfer files through temporary draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cp fixture/portable.rsbackup "fixture/fixture-$PLATFORM.rsbackup"
          cp fixture/git-portable.rsbackup "fixture/git-$PLATFORM.rsbackup"
          cp fixture/remote-portable.rsbackup "fixture/remote-$PLATFORM.rsbackup"
          gh release upload "$STAGING_TAG" dist/* "fixture/fixture-$PLATFORM.rsbackup" "fixture/git-$PLATFORM.rsbackup" "fixture/remote-$PLATFORM.rsbackup"

  desktop:
    needs: staging
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            application: apps/desktop/src-tauri/target/release/repo-stealer-desktop
            bundles: deb,appimage
          - os: windows-2022
            platform: windows
            application: apps/desktop/src-tauri/target/release/repo-stealer-desktop.exe
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Identify desktop compiler cache
        id: compiler
        shell: bash
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: desktop_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle/**
          key: desktop-${{ runner.os }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ steps.compiler.outputs.version }}-
      - if: runner.os == 'Linux'
        name: Install desktop build and native automation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11 cryptsetup rpm desktop-file-utils
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
      - run: npm --prefix apps/desktop run build
      - run: npm --prefix apps/desktop test
      - name: Build native desktop
        id: desktop_build
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: '2'
        run: npm run tauri build -- --no-bundle -- --locked
      - if: runner.os == 'Linux'
        name: Enforce private RAM-backed browser profile policy
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --features tauri/custom-protocol
      - run: cargo install tauri-driver --version 2.0.6 --locked
        env:
          CARGO_TARGET_DIR: apps/desktop/src-tauri/target/driver
      - run: python -m pip install selenium==4.52.0
      - if: runner.os == 'Windows'
        name: Match automation driver to installed WebView2 runtime
        run: python scripts/prepare_webview_driver.py
      - if: runner.os == 'Linux'
        run: python scripts/ci_workspace.py create
      - if: runner.os == 'Linux'
        name: Native WebKit desktop workflow
        run: xvfb-run -a dbus-run-session -- python scripts/test_desktop_native.py ${{ matrix.application }}
      - if: runner.os == 'Windows'
        name: Native WebView2 desktop workflow
        run: python scripts/test_desktop_native.py ${{ matrix.application }}
      - if: always() && runner.os == 'Linux'
        run: python scripts/ci_workspace.py destroy
      - name: Bundle native desktop installers
        working-directory: apps/desktop
        run: npm run tauri bundle -- --bundles ${{ matrix.bundles }}
      - run: python scripts/package_desktop.py
      - if: runner.os == 'Linux'
        name: Install desktop DEB and launch AppImage
        run: xvfb-run -a dbus-run-session -- python scripts/test_desktop_packages.py
      - if: runner.os == 'Windows'
        name: Install and launch Windows desktop
        run: python scripts/test_desktop_packages.py
      - if: github.event_name != 'pull_request'
        name: Transfer desktop installers through temporary draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$STAGING_TAG" dist-desktop/*
      - if: always() && steps.desktop_build.outcome == 'success' && steps.desktop_cache.outputs.cache-hit != 'true'
        name: Retain compiled dependencies after test diagnostics
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle/**
          key: ${{ steps.desktop_cache.outputs.cache-primary-key }}

  interoperability:
    if: github.event_name != 'pull_request'
    needs: [staging, native]
    permissions:
      contents: write # draft assets are restricted to repository writers
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            other: windows
          - os: windows-2022
            platform: windows
            other: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download native executable and other OS fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
          OTHER: ${{ matrix.other }}
        run: |
          if [ "$PLATFORM" = linux ]; then
            gh release download "$STAGING_TAG" --pattern '*linux*.tar.gz' --dir packages
          else
            gh release download "$STAGING_TAG" --pattern '*.exe' --dir packages
          fi
          gh release download "$STAGING_TAG" --pattern "fixture-$OTHER.rsbackup" --dir fixture
          gh release download "$STAGING_TAG" --pattern "git-$OTHER.rsbackup" --dir fixture
          gh release download "$STAGING_TAG" --pattern "remote-$OTHER.rsbackup" --dir fixture
      - if: runner.os == 'Linux'
        name: Provision encrypted cross-OS restore storage
        run: |
          sudo apt-get update && sudo apt-get install -y cryptsetup
          python scripts/ci_workspace.py create
      - if: runner.os == 'Linux'
        run: |
          tar -xzf packages/*linux*.tar.gz
          python scripts/test_cli.py repo-stealer-*/repo-stealer --restore-fixture fixture/fixture-${{ matrix.other }}.rsbackup
          python scripts/test_git.py repo-stealer-*/repo-stealer --restore-fixture fixture/git-${{ matrix.other }}.rsbackup
          python scripts/test_remote.py repo-stealer-*/repo-stealer --restore-fixture fixture/remote-${{ matrix.other }}.rsbackup
      - if: runner.os == 'Windows'
        run: |
          python scripts/test_cli.py packages/repo-stealer-windows-x86_64.exe --restore-fixture fixture/fixture-${{ matrix.other }}.rsbackup
          python scripts/test_git.py packages/repo-stealer-windows-x86_64.exe --restore-fixture fixture/git-${{ matrix.other }}.rsbackup
          python scripts/test_remote.py packages/repo-stealer-windows-x86_64.exe --restore-fixture fixture/remote-${{ matrix.other }}.rsbackup
      - if: always() && runner.os == 'Linux'
        name: Inspect raw encrypted cross-OS storage
        run: python scripts/ci_workspace.py destroy

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, interoperability, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Download verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$STAGING_TAG" --pattern 'repo-stealer*' --dir dist
      - name: Validate version and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$RELEASE_TAG"
          python scripts/release_checksums.py
      - name: Publish experimental desktop and CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --generate-notes --title "Repo Stealer $RELEASE_TAG (desktop and CLI alpha)" --notes-file .github/release-notes.md

  cleanup:
    if: always() && github.event_name != 'pull_request' && needs.staging.result == 'success'
    needs: [staging, quality, native, desktop, interoperability, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Remove this run's temporary draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$STAGING_TAG" --yes
